volumes:
  shared-data:

services:

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto:/mosquitto/config
    command: mosquitto -c /mosquitto/config/mosquitto.conf

  sensor-simulator:
    build:
      context: .
      dockerfile: Dockerfile.sensor
    environment:
      MQTT_BROKER: mqtt
      MQTT_PORT: 1883
    depends_on:
      - mqtt

  edge-processor:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MQTT_BROKER: mqtt
      MQTT_PORT: 1883
      PYTHONUNBUFFERED: "1"
    depends_on:
      - mqtt

  data-logger:
    build:
      context: .
      dockerfile: Dockerfile.logger
    environment:
      MQTT_BROKER: mqtt
      MQTT_PORT: 1883
      DATA_DIR: /app/data
      PYTHONUNBUFFERED: "1"
    volumes:
      - shared-data:/app/data
    depends_on:
      - mqtt

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "8501:8501"
    environment:
      DATA_DIR: /app/data
    volumes:
      - shared-data:/app/data
    command: >
      streamlit run dashboard.py
      --server.address=0.0.0.0
      --server.port=8501
      --server.headless=true
      --server.enableCORS=false
      --server.enableXsrfProtection=false
    depends_on:
      - data-logger