[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:mosquitto]
command=mosquitto -c /app/mosquitto.conf
autostart=true
autorestart=true
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:sensor_simulator]
command=python -u /app/sensor_simulator.py
autostart=true
autorestart=true
priority=10
environment=MQTT_BROKER="127.0.0.1",MQTT_PORT="1883",PYTHONUNBUFFERED="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:edge_processor]
command=python -u /app/edge_processor.py
autostart=true
autorestart=true
priority=10
environment=MQTT_BROKER="127.0.0.1",MQTT_PORT="1883",PYTHONUNBUFFERED="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:data_logger]
command=python -u /app/data_logger.py
autostart=true
autorestart=true
priority=10
environment=MQTT_BROKER="127.0.0.1",MQTT_PORT="1883",DATA_DIR="/app/data",PYTHONUNBUFFERED="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:dashboard]
command=python -m streamlit run /app/dashboard.py --server.address=0.0.0.0 --server.port=8501 --server.headless=true --server.enableCORS=false --server.enableXsrfProtection=false
autostart=true
autorestart=true
priority=20
environment=DATA_DIR="/app/data",MQTT_BROKER="127.0.0.1",MQTT_PORT="1883"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
